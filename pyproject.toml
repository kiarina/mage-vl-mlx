[project]
name = "mage-vl-mlx"
version = "0.0.1"
description = "Independent MLX port of Microsoft Mage-VL for Apple Silicon"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.32.1",
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python>=4.8",
    "tokenizers>=0.20",
    "jinja2>=3.1",
]

[dependency-groups]
webui = [
    "fastapi>=0.116",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35",
]
fixtures = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.15.1",
    "accelerate==1.14.0",
    "opencv-python>=4.8",
    "safetensors>=0.4",
    "huggingface-hub>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mage_vl_mlx"]
